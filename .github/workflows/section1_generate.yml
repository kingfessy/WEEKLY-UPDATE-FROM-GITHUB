name: Section 1 - Generate (Phase 1)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 4'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run full Section 1 pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          BEA_API_KEY: ${{ secrets.BEA_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FORCE_REFRESH: 'false'
        run: |
          python -u section1/main.py

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit staged output
        run: |
          git add archive/staging/ section1/narrative.json section1/consolidated.json
          git add archive/data/ || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Staging: section 1 for $(date +%Y-%m-%d)"
          git push
